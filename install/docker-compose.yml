# ============================================================
# O.D.I.N. — Orchestrated Dispatch & Inventory Network
#
# Quick Start:
#   1. Save this file: curl -O https://raw.githubusercontent.com/HughKantsime/runsodin/master/install/docker-compose.yml
#   2. Start:          docker compose up -d
#   3. Open:           http://localhost:8000
#
# The setup wizard will walk you through creating an admin
# account and adding your first printer.
#
# Data is stored in ./odin-data/ (database, backups, uploads)
# ============================================================

services:
  odin:
    image: ${ODIN_IMAGE:-ghcr.io/hughkantsime/odin:latest}
    container_name: ${ODIN_CONTAINER_NAME:-odin}
    restart: unless-stopped
    ports:
      - "${ODIN_HTTP_PORT:-8000}:8000"   # Web UI + API
      # go2rtc's API (1984) stays on loopback inside the container: never published.
      - "${ODIN_WEBRTC_PORT:-8555}:8555" # go2rtc WebRTC
    volumes:
      - ${ODIN_DATA_PATH:-./odin-data}:/data
      - ${ODIN_GO2RTC_DATA_PATH:-./odin-data/go2rtc}:/app/go2rtc
    environment:
      # These are auto-generated on first run if left blank.
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - API_KEY=${API_KEY:-}
      - DATABASE_URL=sqlite:////data/odin.db
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8000,http://localhost:3000}
      - ODIN_PUBLIC_URL=${ODIN_PUBLIC_URL:-}
      - ODIN_TAILNET_IP=${ODIN_TAILNET_IP:-}
      # Empty trusts no proxy. With the tailscale profile, set this to tailscale.
      - ODIN_TRUSTED_PROXIES=${ODIN_TRUSTED_PROXIES:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - TRUSTED_HOSTS=${TRUSTED_HOSTS:-*}
      # Set to your server's LAN IP for camera streaming (or configure in Settings > Network)
      - ODIN_HOST_IP=${ODIN_HOST_IP:-}
      - TZ=${TZ:-America/New_York}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Own namespace on the default network: ODIN updates cannot strand Serve.
  tailscale:
    image: tailscale/tailscale:v1.90.9
    profiles: [tailscale]
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_AUTH_ONCE=true
      - TS_HOSTNAME=${TS_HOSTNAME:-odin}
      - TS_USERSPACE=${TS_USERSPACE:-true}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - ${ODIN_DATA_PATH:-./odin-data}/tailscale:/var/lib/tailscale
    configs:
      - source: tailscale_serve
        target: /config/serve.json

# Requires Docker Compose >= 2.23.1 (inline configs). No extra downloaded files.
configs:
  tailscale_serve:
    content: |
      {
        "TCP": {
          "443": {"HTTPS": true},
          "8555": {"TCPForward": "odin:8555"}
        },
        "Web": {
          "$${TS_CERT_DOMAIN}:443": {
            "Handlers": {"/": {"Proxy": "http://odin:8000"}}
          }
        },
        "AllowFunnel": {}
      }
