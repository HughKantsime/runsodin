version: 1
disable_existing_loggers: false
formatters:
  default:
    (): core.supervised_log.DatedFormatter
    formatter: ext://uvicorn.logging.DefaultFormatter
    fmt: '%(levelprefix)s %(message)s'
  access:
    (): core.supervised_log.DatedFormatter
    formatter: ext://uvicorn.logging.AccessFormatter
    fmt: '%(levelprefix)s %(client_addr)s - "%(request_line)s" %(status_code)s'
handlers:
  service:
    (): core.supervised_log.api_log_handler
  default:
    class: logging.StreamHandler
    formatter: default
    stream: ext://sys.stderr
  access:
    class: logging.StreamHandler
    formatter: access
    stream: ext://sys.stdout
loggers:
  uvicorn:
    handlers: [default]
    level: INFO
    propagate: false
  uvicorn.error:
    level: INFO
  uvicorn.access:
    handlers: [access]
    level: INFO
    propagate: false
root:
  handlers: [service]
  level: WARNING
