# ============================================================
# O.D.I.N. Enterprise — Decomposed Docker Compose
#
# Splits the monolith into separate services for:
# - PostgreSQL database (scalable, proper backups)
# - Backend API (FastAPI, horizontally scalable)
# - Printer monitors (background workers, crash-independent)
# - Vision AI (GPU-optional, resource-intensive)
# - go2rtc (camera streaming, WebRTC relay)
#
# Usage:
#   export POSTGRES_ADMIN_PASSWORD_FILE=/absolute/path/to/admin-secret
#   export POSTGRES_APP_PASSWORD_FILE=/absolute/path/to/app-secret
#   export POSTGRES_MAINTENANCE_PASSWORD_FILE=/absolute/path/to/maintenance-secret
#   docker compose -f docker-compose.enterprise.yml config
#   docker compose -f docker-compose.enterprise.yml up -d
#
# For simple self-hosted installs, use docker-compose.yml instead (single container).
# ============================================================

services:

  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    environment:
      POSTGRES_DB: odin
      POSTGRES_USER: odin_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      ODIN_APP_PASSWORD_FILE: /run/secrets/postgres_app_password
      ODIN_MAINTENANCE_PASSWORD_FILE: /run/secrets/postgres_maintenance_password
    secrets:
      - source: postgres_admin_password
        target: postgres_admin_password
        uid: "70"
        gid: "70"
        mode: 0400
      - source: postgres_app_password
        target: postgres_app_password
        uid: "70"
        gid: "70"
        mode: 0400
      - source: postgres_maintenance_password
        target: postgres_maintenance_password
        uid: "70"
        gid: "70"
        mode: 0400
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init/10-odin-roles.sh:/docker-entrypoint-initdb.d/10-odin-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odin_admin -d odin"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ─────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["/usr/bin/supervisord", "-n", "-c", "/etc/supervisor/conf.d/api.conf"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://odin@postgres:5432/odin
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_app_password
      DATABASE_MAINTENANCE_URL: postgresql://odin_maintenance@postgres:5432/postgres
      DATABASE_MAINTENANCE_PASSWORD_FILE: /run/secrets/postgres_maintenance_password
      ODIN_DB_BOOTSTRAP_OWNER: "1"
      ODIN_DB_ROLE: api
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      API_KEY: ${API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-*}
      ODIN_HOST_IP: ${ODIN_HOST_IP:-}
      TZ: ${TZ:-America/New_York}
    secrets:
      - source: postgres_app_password
        target: postgres_app_password
        uid: "10001"
        gid: "10001"
        mode: 0400
      - source: postgres_maintenance_password
        target: postgres_maintenance_password
        uid: "10001"
        gid: "10001"
        mode: 0400
    ports:
      - "8000:8000"
    volumes:
      - odin-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Printer Monitors ────────────────────────────────────────
  # Runs: mqtt_monitor, moonraker_monitor, prusalink_monitor, elegoo_monitor
  monitors:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["/usr/bin/supervisord", "-n", "-c", "/etc/supervisor/conf.d/monitors.conf"]
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://odin@postgres:5432/odin
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_app_password
      ODIN_DB_BOOTSTRAP_OWNER: "0"
      ODIN_DB_ROLE: monitor-bambu
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      TZ: ${TZ:-America/New_York}
    secrets:
      - source: postgres_app_password
        target: postgres_app_password
        uid: "10001"
        gid: "10001"
        mode: 0400
    volumes:
      - odin-data:/data
    # Monitors need LAN access for printer discovery
    # network_mode: host  # Uncomment if printers are on the same network

  # ── Vision AI ───────────────────────────────────────────────
  # Runs: vision_monitor, inference_engine, detection_thread
  vision:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["/usr/bin/supervisord", "-n", "-c", "/etc/supervisor/conf.d/vision.conf"]
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://odin@postgres:5432/odin
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_app_password
      ODIN_DB_BOOTSTRAP_OWNER: "0"
      ODIN_DB_ROLE: vision
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      TZ: ${TZ:-America/New_York}
    secrets:
      - source: postgres_app_password
        target: postgres_app_password
        uid: "10001"
        gid: "10001"
        mode: 0400
    volumes:
      - odin-data:/data
    # Uncomment for GPU acceleration:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ── go2rtc (Camera Streaming) ───────────────────────────────
  go2rtc:
    image: alexxit/go2rtc@sha256:61b8f04efe0f9025739ce0e5e5a5e0748b64c1e4bdb5ae707e9d0966150175e7
    restart: unless-stopped
    ports:
      - "8555:8555"  # WebRTC
      - "1984:1984"  # HLS/API (expose if needed)
    volumes:
      - ./odin-data/go2rtc:/config
    environment:
      TZ: ${TZ:-America/New_York}

  # ── Report Runner ───────────────────────────────────────────
  reports:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["/usr/bin/supervisord", "-n", "-c", "/etc/supervisor/conf.d/reports.conf"]
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://odin@postgres:5432/odin
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_app_password
      ODIN_DB_BOOTSTRAP_OWNER: "0"
      ODIN_DB_ROLE: reports
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      TZ: ${TZ:-America/New_York}
    secrets:
      - source: postgres_app_password
        target: postgres_app_password
        uid: "10001"
        gid: "10001"
        mode: 0400
    volumes:
      - odin-data:/data

volumes:
  postgres-data:
  odin-data:

secrets:
  postgres_admin_password:
    file: ${POSTGRES_ADMIN_PASSWORD_FILE:?Set POSTGRES_ADMIN_PASSWORD_FILE to an absolute mode-0600 file}
  postgres_app_password:
    file: ${POSTGRES_APP_PASSWORD_FILE:?Set POSTGRES_APP_PASSWORD_FILE to an absolute mode-0600 file}
  postgres_maintenance_password:
    file: ${POSTGRES_MAINTENANCE_PASSWORD_FILE:?Set POSTGRES_MAINTENANCE_PASSWORD_FILE to an absolute mode-0600 file}
