apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: odin-demo
  namespace: odin-demo
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: odin-demo-noindex@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - demo.subsystem.app
    secretName: demo-subsystem-app-tls
  rules:
  - host: demo.subsystem.app
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: odin
            port:
              number: 8000
---
# Stamps every response from the demo origin with hardening headers.
# Mutating-method rejection is enforced by the backend (ODIN_DEMO_MODE=1
# rejects writes/uploads/rotations) — documented in ops/demo/README.md.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: noindex
  namespace: odin-demo
spec:
  headers:
    customResponseHeaders:
      X-Robots-Tag: "noindex, nofollow, noarchive, nosnippet"
      Strict-Transport-Security: "max-age=31536000; includeSubDomains"
      X-Content-Type-Options: "nosniff"
      X-Frame-Options: "DENY"
      Referrer-Policy: "no-referrer"
