apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: odin-demo
data:
  mosquitto.conf: |
    listener 1883 0.0.0.0
    allow_anonymous true
    persistence false
    log_dest stderr
    log_type error
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: odin-demo
  labels:
    app: mosquitto
    odin_env: demo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
        odin_env: demo
    spec:
      containers:
      - name: mosquitto
        image: eclipse-mosquitto:2.0
        ports:
        - containerPort: 1883
          name: mqtt
        volumeMounts:
        - name: config
          mountPath: /mosquitto/config/mosquitto.conf
          subPath: mosquitto.conf
          readOnly: true
        readinessProbe:
          tcpSocket:
            port: 1883
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 1883
          initialDelaySeconds: 10
          periodSeconds: 30
        resources:
          limits:
            cpu: 200m
            memory: 64Mi
          requests:
            cpu: 25m
            memory: 16Mi
      volumes:
      - name: config
        configMap:
          name: mosquitto-config
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: odin-demo
  labels:
    app: mosquitto
spec:
  type: ClusterIP
  selector:
    app: mosquitto
  ports:
  - name: mqtt
    port: 1883
    targetPort: 1883
