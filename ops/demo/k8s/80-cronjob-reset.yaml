# Nightly demo reset at 03:00 UTC per ODIN-129 hard requirement #5.
#
# Deletes all pods (Recreate strategy ensures clean restart), wipes the
# odin-demo-data PVC contents (via a privileged init-style Job), rotates
# the reviewer password, and reseeds the reviewer account.
#
# The CronJob runs the reset script in a small image with `kubectl`
# already baked. Service account `odin-demo-resetter` has scoped RBAC
# only inside this namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: odin-demo-resetter
  namespace: odin-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: odin-demo-resetter
  namespace: odin-demo
rules:
- apiGroups: ["apps"]
  resources: ["deployments", "deployments/scale"]
  verbs: ["get", "patch", "update"]
- apiGroups: [""]
  resources: ["pods", "pods/exec"]
  verbs: ["get", "list", "create", "delete"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "patch", "update"]
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: odin-demo-resetter
  namespace: odin-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: odin-demo-resetter
subjects:
- kind: ServiceAccount
  name: odin-demo-resetter
  namespace: odin-demo
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: odin-demo-reset
  namespace: odin-demo
spec:
  schedule: "0 3 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          serviceAccountName: odin-demo-resetter
          restartPolicy: Never
          containers:
          - name: resetter
            image: bitnami/kubectl:1.34
            command: ["/bin/bash", "-eu", "-o", "pipefail", "-c"]
            args:
            - |
              set -eu
              echo "[reset] scaling odin/publisher down"
              kubectl -n odin-demo scale deploy/odin --replicas=0
              kubectl -n odin-demo scale deploy/publisher --replicas=0
              # Wait for pods to terminate so the PVC is unmounted.
              for i in $(seq 1 30); do
                count=$(kubectl -n odin-demo get pods -l 'app in (odin,publisher)' -o name 2>/dev/null | wc -l)
                if [ "$count" -eq 0 ]; then break; fi
                sleep 2
              done

              echo "[reset] wiping data via ephemeral pod"
              # Mount the PVC into a throwaway pod and rm its contents.
              kubectl -n odin-demo run wipe-tmp --restart=Never \
                --image=busybox:1.36 \
                --overrides="$(cat <<'EOF'
              {
                "spec": {
                  "containers": [{
                    "name": "wipe",
                    "image": "busybox:1.36",
                    "command": ["sh","-c","rm -rf /data/* /data/.[!.]* 2>/dev/null || true"],
                    "volumeMounts": [{"name":"data","mountPath":"/data"}]
                  }],
                  "volumes": [{"name":"data","persistentVolumeClaim":{"claimName":"odin-demo-data"}}],
                  "restartPolicy": "Never"
                }
              }
              EOF
              )" -- /bin/true
              kubectl -n odin-demo wait --for=condition=Ready pod/wipe-tmp --timeout=60s || true
              kubectl -n odin-demo wait --for=jsonpath='{.status.phase}'=Succeeded pod/wipe-tmp --timeout=60s
              kubectl -n odin-demo delete pod wipe-tmp --ignore-not-found

              echo "[reset] rotating reviewer password"
              # Generate a 16-char alphanumeric password, store in the
              # demo-reviewer-credentials secret. demo_seed_reviewer reads
              # it on next start.
              PW=$(tr -dc 'A-Za-z0-9' </dev/urandom | head -c 16)
              kubectl -n odin-demo patch secret demo-reviewer-credentials \
                --type=merge \
                -p "{\"stringData\":{\"password\":\"$PW\",\"rotated_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}}"

              echo "[reset] scaling odin/publisher back up"
              kubectl -n odin-demo scale deploy/odin --replicas=1
              kubectl -n odin-demo scale deploy/publisher --replicas=1
              echo "[reset] done"
            resources:
              limits:
                cpu: 200m
                memory: 128Mi
              requests:
                cpu: 25m
                memory: 32Mi
