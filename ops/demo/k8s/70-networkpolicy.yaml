apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: odin-demo
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
# Allow ingress to `odin` from kube-system traefik (the only public path).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: odin-allow-traefik
  namespace: odin-demo
spec:
  podSelector:
    matchLabels:
      app: odin
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
    ports:
    - protocol: TCP
      port: 8000
---
# Allow ingress to `mosquitto` only from `odin` and `publisher` pods in
# this namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mosquitto-allow-internal
  namespace: odin-demo
spec:
  podSelector:
    matchLabels:
      app: mosquitto
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: odin
    - podSelector:
        matchLabels:
          app: publisher
    ports:
    - protocol: TCP
      port: 1883
---
# Egress: `odin` and `publisher` need DNS, and need to talk to mosquitto
# inside the namespace. They MUST NOT be able to reach prod ODIN, the
# customer-data plane, or any external runsodin.com path.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-egress-restrict
  namespace: odin-demo
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - odin
      - publisher
  policyTypes:
  - Egress
  egress:
  # DNS — kube-dns
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # In-namespace mosquitto
  - to:
    - podSelector:
        matchLabels:
          app: mosquitto
    ports:
    - protocol: TCP
      port: 1883
---
# Mosquitto egress: DNS only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mosquitto-egress
  namespace: odin-demo
spec:
  podSelector:
    matchLabels:
      app: mosquitto
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
