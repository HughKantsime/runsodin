title = "O.D.I.N. Gitleaks Config"

# Without this the config defines no rules and gitleaks detects nothing.
[extend]
useDefault = true

[allowlist]
  description = "Known false positives — test credentials and dev defaults"
  paths = [
    '''tests/conftest\.py''',
    '''tests/test_features\.py''',
    '''\.env\.example''',
    '''\.env\.test''',
    # SHA-256 source manifests: migration filenames such as *_idempotency_keys.sql trip generic-api-key.
    '''tests/fixtures/certification/pre026-independent-history-oracle\.json''',
    '''tests/fixtures/certification/prepriced027/catalogue\.json''',
  ]
  regexes = [
    '''odin-dev-secret-change-in-production''',
    '''ViewerTestPass1''',
    '''OperatorTestPass1''',
    '''AdminTestPass1''',
    '''test_(viewer|operator|admin)_rbac''',
    '''OdinAdmin1''',
    # Synthetic UniFi Protect path token in test_cert_B_camera_fixes.py (no real camera).
    '''aB3dE5fG7hJ9kL1m''',
    '''[0-9]{3}_[a-z_]*keys[a-z_]*\.sql['"]\s*[:,]\s*['"][0-9a-f]{64}['"]''',
  ]
  # SHA-256 source digests keyed by migration filenames (e.g. *_idempotency_keys.sql)
  # trip generic-api-key; the line shape is a 64-hex digest after a .sql path.
  regexTarget = "line"

