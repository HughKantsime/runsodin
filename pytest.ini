[pytest]
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: exercises disposable local services such as the OCI registry
    live_environment: needs a built ODIN image, Docker, network, an external checkout or a real model; deselected by the contract gate against a committed inventory and run in the certification batches
    preserved029_bundle: qualified-source check whose subject is the preserved029 bundle; deselected unless the bundle is the backend root (test_preserved029_contract_target.py runs them)
testpaths = tests
