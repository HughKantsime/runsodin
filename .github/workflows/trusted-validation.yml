name: Trusted Validation

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full 40-character candidate commit SHA
        required: true
        type: string
      target_ref:
        description: Candidate branch name (release-candidate/<SHA>)
        required: true
        type: string

permissions: {}

jobs:
  validate:
    name: Trusted candidate validation
    runs-on: [self-hosted, odin-ci]
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      TARGET_REF: ${{ inputs.target_ref }}
      RELEASE_CONTROL_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Validate dispatch identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_ACTOR" = "HughKantsime"
          test "$GITHUB_ACTOR_ID" = "201174638"
          test "$GITHUB_TRIGGERING_ACTOR" = "$GITHUB_ACTOR"
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$TARGET_REF" = "release-candidate/$TARGET_SHA"
          command -v python3.11 >/dev/null || { echo "Required tool missing from PATH: python3.11" >&2; exit 1; }
          command -v node >/dev/null || { echo "Required tool missing from PATH: node" >&2; exit 1; }
          command -v npm >/dev/null || { echo "Required tool missing from PATH: npm" >&2; exit 1; }
          command -v mosquitto >/dev/null || { echo "Required tool missing from PATH: mosquitto" >&2; exit 1; }
          command -v docker >/dev/null || { echo "Required tool missing from PATH: docker" >&2; exit 1; }
          command -v git >/dev/null || { echo "Required tool missing from PATH: git" >&2; exit 1; }
          command -v git-lfs >/dev/null || { echo "Required tool missing from PATH: git-lfs" >&2; exit 1; }
          command -v make >/dev/null || { echo "Required tool missing from PATH: make" >&2; exit 1; }
          command -v gitleaks >/dev/null || { echo "Required tool missing from PATH: gitleaks" >&2; exit 1; }
          command -v semgrep >/dev/null || { echo "Required tool missing from PATH: semgrep" >&2; exit 1; }
          command -v hadolint >/dev/null || { echo "Required tool missing from PATH: hadolint" >&2; exit 1; }
          python3.11 -P -c 'import sys; sys.version_info[:2] == (3, 11) or sys.exit("Python 3.11 is required")'
          test "$(node --version)" = v25.9.0 || { echo "Node 25.9.0 is required" >&2; exit 1; }
          npm_version="$(npm --version)"
          [[ "$npm_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && test "${npm_version%%.*}" -ge 10 || { echo "npm 10 or newer is required" >&2; exit 1; }
          mosquitto -h | head -n 1 | grep -Eq '^mosquitto version 2\.' || { echo "Mosquitto 2.x is required" >&2; exit 1; }
          docker_bin="$(command -v docker)"
          docker_host="$("$docker_bin" context inspect --format '{{ .Endpoints.docker.Host }}')"
          [[ "$docker_host" =~ ^unix:///[^[:space:]]+\.sock$ ]]
          DOCKER_HOST="$docker_host" "$docker_bin" version >/dev/null
          DOCKER_HOST="$docker_host" "$docker_bin" version --format '{{.Server.Version}}' | grep -Eq '^29\.' || { echo "Docker Engine 29.x is required" >&2; exit 1; }
          docker buildx version >/dev/null || { echo "Docker buildx plugin is required" >&2; exit 1; }

      - name: Check out immutable candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Materialize and verify pinned vision model
        shell: bash
        run: |
          set -euo pipefail
          git lfs checkout -- backend/vision_models_default/obico_spaghetti.onnx
          PYTHONSAFEPATH=1 python3.11 -P - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path
          path = Path("backend/vision_models_default/obico_spaghetti.onnx")
          pointer = subprocess.check_output(["git", "show", f"HEAD:{path}"], text=True)
          if not pointer.startswith("version https://git-lfs.github.com/spec/v1\n"):
              raise SystemExit("Committed vision model is not an LFS pointer")
          fields = dict(line.split(" ", 1) for line in pointer.splitlines())
          digest = hashlib.sha256()
          size = 0
          with path.open("rb") as model:
              for chunk in iter(lambda: model.read(8 * 1024 * 1024), b""):
                  size += len(chunk)
                  digest.update(chunk)
          if size != int(fields["size"]) or "sha256:" + digest.hexdigest() != fields["oid"]:
              raise SystemExit("Vision model is not materialized or does not match the committed LFS object")
          print("Pinned vision model materialized and verified")
          PY

      - name: Bootstrap clean-checkout validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3.11 -m venv .hardware-cert-venv
          .hardware-cert-venv/bin/pip install --disable-pip-version-check \
            -r backend/requirements.txt -r ops/hardware_certification/requirements.txt
          python3.11 -m venv .venv-stress
          .venv-stress/bin/pip install --disable-pip-version-check -r backend/requirements.txt
          python3.11 -m venv .venv-contracts
          .venv-contracts/bin/pip install --disable-pip-version-check -r tests/requirements-contracts.txt
          printf '%s\n' "$GITHUB_WORKSPACE/.venv-contracts/bin" >> "$GITHUB_PATH"
          npm --prefix frontend ci
          PLAYWRIGHT_SKIP_BROWSER_GC=1 .venv-contracts/bin/python -m playwright install chromium
          (cd frontend && PLAYWRIGHT_SKIP_BROWSER_GC=1 npx --no-install playwright install chromium)

      - name: Verify candidate ref and run aggregate gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          remote_sha="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk '{print $1}')"
          test "$remote_sha" = "$TARGET_SHA"
          make trusted-validation-gate PYTHON=python3.11

      - name: Build practical release evidence
        shell: bash
        run: |
          set -euo pipefail
          make practical-evidence SOURCE_RUN_DIR="artifacts/trusted-validation/${RELEASE_CONTROL_RUN_ID}" EXPECTED_SHA="$TARGET_SHA" PYTHON=python3.11

      - name: Upload sanitized validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: odin-trusted-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/trusted-validation/${{ env.RELEASE_CONTROL_RUN_ID }}/evidence/
          if-no-files-found: error
          retention-days: 30
