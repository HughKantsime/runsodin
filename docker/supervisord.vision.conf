[supervisord]
nodaemon=true
user=odin
logfile=/data/supervisord-vision.log
pidfile=/var/run/supervisord.pid

[program:vision_monitor]
command=python3 -m modules.vision.monitor
directory=/app/backend
autostart=true
autorestart=true
stdout_logfile=/data/vision_monitor.log
redirect_stderr=true
environment=PYTHONUNBUFFERED="1",ODIN_DB_ROLE="vision"

# Timelapse capture reads frames from go2rtc's API like vision (ODIN_GO2RTC_API_URL and the
# shared relay secret are set for this container in docker-compose.enterprise.yml) and writes
# them under /data/timelapses on the shared odin-data volume.
[program:timelapse_capture]
command=python3 -m modules.archives.timelapse_capture
directory=/app/backend
autostart=true
autorestart=true
stdout_logfile=/data/timelapse_capture.log
redirect_stderr=true
environment=PYTHONUNBUFFERED="1",ODIN_DB_ROLE="timelapse"
