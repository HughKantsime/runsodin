[supervisord]
nodaemon=true
user=odin
logfile=/data/supervisord-monitors.log
pidfile=/var/run/supervisord.pid

; startsecs=0 (as in supervisord.conf): a monitor that exits 75 to retire a
; license-locked or reconfigured printer (core/license_monitor.py) is restarted
; at once and never counted as a failed start.

[program:mqtt_monitor]
command=python3 -m modules.printers.monitors.mqtt_monitor
directory=/app/backend
autostart=true
autorestart=true
startsecs=0
stdout_logfile=/data/mqtt_monitor.log
redirect_stderr=true
environment=PYTHONUNBUFFERED="1",ODIN_DB_ROLE="monitor-bambu"

