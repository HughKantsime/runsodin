[supervisord]
nodaemon=true
user=odin
logfile=/data/supervisord-api.log
pidfile=/var/run/supervisord.pid

[program:backend]
command=python3 -m uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4
directory=/app/backend
autostart=true
autorestart=true
startretries=5
startsecs=5
stdout_logfile=/data/backend.log
redirect_stderr=true
environment=PYTHONUNBUFFERED="1",ODIN_DB_ROLE="api"
