[supervisord]
nodaemon=true
user=odin
logfile=/data/supervisord-api.log
pidfile=/var/run/supervisord.pid

[program:backend]
command=python3 -m core.supervised_log python3 -m core.api_server --host 0.0.0.0 --workers 4 --no-proxy-headers
directory=/app/backend
autostart=true
autorestart=true
startretries=5
startsecs=5
stdout_logfile=/data/backend.log
redirect_stderr=true
environment=PYTHONUNBUFFERED="1",ODIN_DB_ROLE="api"
