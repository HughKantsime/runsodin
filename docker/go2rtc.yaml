# O.D.I.N. — go2rtc camera proxy configuration
# This file is auto-managed by O.D.I.N. when you add printers with cameras.
# Manual edits will be overwritten.

streams: {}

# WebRTC and API settings
webrtc:
  listen: ":8555"

api:
  listen: "127.0.0.1:1984"

# RTSP re-serving: loopback only. O.D.I.N. adds per-boot credentials when it writes this file.
rtsp:
  listen: "127.0.0.1:8554"
